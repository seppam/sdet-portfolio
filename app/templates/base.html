<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Struk Kilat{% endblock %}</title>
  <style>
    :root { --ink:#1d2321; --muted:#5c6763; --line:#d9dfdc; --bg:#f6f7f5; --accent:#0f6e56;
            --bad:#a3312a; --warn:#8a5a00; }
    * { box-sizing: border-box; }
    body { margin:0; font: 16px/1.5 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    header { background:var(--ink); color:#fff; padding:14px 20px; }
    header a { color:#fff; text-decoration:none; font-weight:700; }
    main { max-width: 820px; margin: 24px auto; padding: 0 16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); }
    .num { text-align:right; font-variant-numeric: tabular-nums; }
    button { background:var(--accent); color:#fff; border:0; padding:10px 16px; border-radius:6px; font-weight:600; cursor:pointer; }
    .alert { padding:10px 14px; border-radius:6px; background:#fbeceb; color:var(--bad); margin-bottom:12px; }
    .status { font-weight:700; text-transform:uppercase; font-size:13px; letter-spacing:.04em; }
    .status-done { color:var(--accent); } .status-failed { color:var(--bad); }
    .status-queued, .status-processing { color:var(--warn); }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <header><a href="/">Struk Kilat</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
