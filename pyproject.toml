[project]
name = "struk-kilat"
version = "0.1.0"
description = "App kecil upload laporan pengeluaran (CSV) via S3 + SQS, dibangun sebagai porto SDET"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "boto3>=1.35",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-html>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: butuh emulator AWS (moto server / mini-aws) yang jalan",
    "e2e: butuh app + browser (Playwright)",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient.",
    # berasal dari plugin pytest-playwright, bukan kode kita
    "ignore:Session-scoped fixtures defined as instance methods",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Pola standar FastAPI: `file: UploadFile = File(...)`
extend-immutable-calls = ["fastapi.File"]

[tool.coverage.run]
source = ["app", "mini_aws"]
